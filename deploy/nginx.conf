# ─────────────────────────────────────────────────────────────────────────────
# nginx – Auslieferung des statischen Builds (web/build/client)
# Wird vom Dockerfile nach /etc/nginx/conf.d/default.conf kopiert.
# Läuft hinter einem Reverse-Proxy (z. B. Nginx Proxy Manager), der HTTPS macht.
# ─────────────────────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  # ── Sicherheit ────────────────────────────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
  # TODO vor Livegang: Content-Security-Policy ergänzen (siehe docs/06-datenschutz.md)

  # ── Komprimierung ─────────────────────────────────────────────────────────
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json
             application/xml image/svg+xml text/plain text/markdown text/x-script;

  # ── Startseite → Standardsprache ─────────────────────────────────────────
  location = / {
    return 301 /de/;
  }

  # ── Caching ───────────────────────────────────────────────────────────────
  # Dateien mit Hash im Namen ändern sich nie → 1 Jahr
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location /fonts/ {
    expires 1y;
    try_files $uri =404;
  }
  # Lokal gespiegelte CMS-Bilder (Name = Hash der Quelle)
  location /media/ {
    expires 30d;
    try_files $uri =404;
  }

  # Seitendaten für die Client-Navigation (React Router, *.data)
  # (kein eigener types{}-Block – der würde die Standard-MIME-Typen ersetzen)
  location ~ \.data$ {
    default_type text/x-script;
    expires -1;
    try_files $uri =404;
  }

  # ── Seiten ───────────────────────────────────────────────────────────────
  # /de/work → /de/work/index.html (ohne Weiterleitung), /de/work.data → Daten
  location / {
    expires -1;
    try_files $uri $uri/index.html =404;
  }

  # Unbekannte URLs: Status 404 + App-Fallback (zeigt die gestaltete 404-Seite)
  error_page 404 /__spa-fallback.html;
  location = /__spa-fallback.html {
    internal;
    expires -1;
  }
}
