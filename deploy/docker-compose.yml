# ─────────────────────────────────────────────────────────────────────────────
# Website + optionaler Dienst für unbeantwortete Chat-Fragen.
#   docker compose -f deploy/docker-compose.yml up -d --build
# Davor läuft ein Reverse-Proxy (z. B. Nginx Proxy Manager), der HTTPS macht → Port 8080.
# ─────────────────────────────────────────────────────────────────────────────
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Sanity-Zugang beim Build (Werte aus der Umgebung bzw. einer .env neben dieser Datei)
      args:
        SANITY_PROJECT_ID: ${SANITY_PROJECT_ID:-}
        SANITY_DATASET: ${SANITY_DATASET:-production}
    ports:
      - "8080:80"
    restart: unless-stopped

  # Unbeantwortete Fragen (anonym) – erst einschalten, wenn die Datenschutzerklärung es erwähnt
  # (web/app/features/ask/config.ts → logEndpoint: "/api/ask-log")
  ask-log:
    build:
      context: ..
      dockerfile: deploy/ask-log/Dockerfile
    volumes:
      - ./data:/data
    restart: unless-stopped
